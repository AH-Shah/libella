[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libella"
version = "0.1.4"
description = "Spatial Transcriptomics GNN Pipeline for Ecotype Discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Amirhossein", email = "ahshahsavand02@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "anndata>=0.9.0",
    "entmax>=1.3",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "scanpy>=1.9.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "tqdm>=4.65.0"
]

[project.scripts]
libella = "libella.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/libella"]

[tool.hatch.build.targets.sdist]
include = ["/src/libella"]